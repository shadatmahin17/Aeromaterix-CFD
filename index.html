    <noscript>
      <main>
        <h1>AeroLab — Interactive 3D Aircraft Wind Tunnel &amp; Aerodynamics Simulator</h1>
        <p>
          AeroLab is a real-time 3D computational fluid dynamics (CFD) wind tunnel and flight physics workstation.
          Explore Biot-Savart horseshoe vortex lattice airflow, 3D surface pressure heatmaps, stall separation,
          wingtip vortices, and supersonic Mach shock cones directly in your browser.
        </p>
        <section>
          <h2>Supported Aircraft &amp; Airfoil Models</h2>
          <ul>
            <li><strong>F-22 Raptor</strong> — Stealth fighter 3D GLB mesh with high-alpha vortex lift and supersonic flight.</li>
            <li><strong>Boeing 787 Dreamliner</strong> — Commercial airliner CAD model with Fowler flaps (0°–35°).</li>
            <li><strong>Concorde SST</strong> — Supersonic delta-wing transport with oblique Mach shock cone simulation.</li>
            <li><strong>NACA 2412</strong> — Cambered 3D airfoil section for camber lift and flap testing.</li>
            <li><strong>NACA 0012</strong> — Symmetric reference airfoil for zero-camber stall and lift polar analysis.</li>
            <li><strong>Circular Cylinder</strong> — Bluff-body benchmark demonstrating von Kármán vortex shedding.</li>
          </ul>
        </section>
        <section>
          <h2>Live Telemetry &amp; Data Export</h2>
          <p>
            Analyze Lift Coefficient (CL), Drag Coefficient (CD), L/D glide ratio, Mach number, dynamic pressure,
            and chordwise pressure distributions (Cp), and export simulation snapshots as JSON, CSV, SVG, and PNG.
            Please enable JavaScript to run the interactive 3D simulation.
          </p>
        </section>
      </main>
